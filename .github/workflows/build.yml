name: Build

# Changes that can't affect the build don't run it. GitHub doesn't apply path filters
# to tag pushes, so a v* tag always builds (as does a manual run).
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "**.md"
      - "README.org"
      - "LICENSE"
      - "TestImages/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "README.org"
      - "LICENSE"
      - "TestImages/**"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR cancels the run it supersedes; release (tag) runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # v1.2.3 tags are version 1.2.3; other builds 0.0.<run number>. The MSIX adds a ".0".
      - id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Release tags must look like v1.2.3, not $GITHUB_REF_NAME"
            exit 1
          else
            version=0.0.$GITHUB_RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish EyeBrowse.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/EyeBrowse-${{ matrix.rid }}

      - name: Archive
        working-directory: publish
        run: |
          name=EyeBrowse-${{ matrix.rid }}
          # Native debug symbols shipped by the SkiaSharp/HarfBuzzSharp packages.
          rm -f "$name"/*.pdb
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: EyeBrowse-${{ matrix.rid }}
          path: publish/EyeBrowse-${{ matrix.rid }}.${{ matrix.archive }}
          # Releases keep their own copies; the release job reads these minutes later.
          retention-days: 14

  msix:
    name: MSIX package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Signed only when the MSIX_CERTIFICATE secret is set (see Packaging/README.md);
      # unsigned is what the Microsoft Store wants, as it signs packages itself.
      - name: Build MSIX bundle
        shell: pwsh
        env:
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          # MSIX versions have four parts, the last 0: 1.2.3 becomes 1.2.3.0.
          $version = "${{ needs.version.outputs.version }}.0"
          $arguments = @{
            Version = $version
            IdentityName = "${{ vars.MSIX_IDENTITY_NAME || 'EyeBrowse' }}"
            Publisher = "${{ vars.MSIX_PUBLISHER || 'CN=EyeBrowse Test' }}"
            PublisherDisplayName = "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'EyeBrowse' }}"
          }
          if ($env:MSIX_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            $arguments.CertificatePath = $pfx
            $arguments.CertificatePassword = ConvertTo-SecureString $env:MSIX_CERTIFICATE_PASSWORD -AsPlainText -Force
          }
          ./Packaging/Build-Msix.ps1 @arguments
          if ($env:MSIX_CERTIFICATE) {
            # The public half, for testers to trust before installing.
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:MSIX_CERTIFICATE_PASSWORD)
            [IO.File]::WriteAllBytes("msix/EyeBrowse.cer", $certificate.Export("Cert"))
            Remove-Item $pfx
          }

      - uses: actions/upload-artifact@v7
        with:
          name: EyeBrowse-msix
          path: |
            msix/*.msixbundle
            msix/*.cer
          retention-days: 14

  release:
    name: Release
    needs: [ build, msix ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
