name: Build

# Changes that can't affect the build don't run it. GitHub doesn't apply path filters
# to tag pushes, so a v* tag always builds (as does a manual run).
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "**.md"
      - "README.org"
      - "LICENSE"
      - "TestImages/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "README.org"
      - "LICENSE"
      - "TestImages/**"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR cancels the run it supersedes; release (tag) runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
    steps:
      # v1.2.3 tags are version 1.2.3, and v1.2.3-beta a pre-release, 1.2.3-beta; other builds
      # are 0.0.<run number>. "number" is without the pre-release part, for the MSIX.
      - id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$ ]]; then
            version=${BASH_REMATCH[1]}
            number=${BASH_REMATCH[2]}
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Release tags must look like v1.2.3 or v1.2.3-beta, not $GITHUB_REF_NAME"
            exit 1
          else
            version=0.0.$GITHUB_RUN_NUMBER
            number=$version
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
          - rid: win-arm64
          - rid: linux-x64
          - rid: linux-arm64
          - rid: osx-x64
          - rid: osx-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish EyeBrowse.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/out

      # Releases offer the program itself, not an archive: one file, downloaded and run.
      - name: Single file
        working-directory: publish
        run: |
          # Native debug symbols shipped by the SkiaSharp/HarfBuzzSharp packages.
          rm -f out/*.pdb
          files=(out/*)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected the publish to be one file, not: ${files[*]}"
            exit 1
          fi
          extension=""
          [[ "${files[0]}" == *.exe ]] && extension=.exe
          mv "${files[0]}" "EyeBrowse-${{ matrix.rid }}$extension"

      - uses: actions/upload-artifact@v7
        with:
          name: EyeBrowse-${{ matrix.rid }}
          path: publish/EyeBrowse-${{ matrix.rid }}*
          # Releases keep their own copies; the release job reads these minutes later.
          retention-days: 14

  msix:
    name: MSIX package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # For uploading to the Microsoft Store, which signs it: unsigned, with the identity
      # Partner Center gives the app (see Packaging/README.md). Not put in GitHub releases.
      - name: Build Store bundle
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME || vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ secrets.MSIX_PUBLISHER || vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME || vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          if (-not ($env:IDENTITY_NAME -and $env:PUBLISHER -and $env:PUBLISHER_DISPLAY_NAME)) {
            Write-Host "::warning::No Store identity (MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME): Store bundle not built"
            exit 0
          }
          # Partner Center's publishers look like CN=12345678-ABCD-...; anything else (such as
          # the old test publisher) won't be accepted by the Store.
          if ($env:PUBLISHER -notmatch '^CN=[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-') {
            Write-Host "::warning::MSIX_PUBLISHER doesn't look like a Partner Center publisher (CN=<ID>)"
          }
          # MSIX versions are four numbers, the last 0: 1.2.3 and 1.2.3-beta become 1.2.3.0.
          ./Packaging/Build-Msix.ps1 -OutDir msix-store `
            -Version "${{ needs.version.outputs.number }}.0" -AppVersion "${{ needs.version.outputs.version }}" `
            -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME

      - uses: actions/upload-artifact@v7
        with:
          name: msix-store
          path: msix-store/*.msixbundle
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release
    needs: [ build, msix ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The programs only; the MSIX bundle is for the Store, not for releases.
      - uses: actions/download-artifact@v8
        with:
          pattern: EyeBrowse-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # v1.2.3-beta and the like.
          prerelease: ${{ contains(github.ref_name, '-') }}
